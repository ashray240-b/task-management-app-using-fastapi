<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --border: #e5e7eb; --primary: #2563eb; --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .container { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .badge-status { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: #e5e7eb; color: var(--muted); }
    .badge-status.ok { background: #dcfce7; color: #166534; }
    .badge-status.bad { background: #fee2e2; color: #991b1b; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 16px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
    input, textarea, select {
      width: 100%; padding: 9px 11px; font: inherit; color: inherit;
      border: 1px solid var(--border); border-radius: 8px; background: #fff;
    }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }

    button {
      font: inherit; cursor: pointer; border: 1px solid var(--border); background: #fff;
      padding: 8px 14px; border-radius: 8px;
    }
    button:hover { background: #f3f4f6; }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { color: var(--danger); border-color: #fecaca; }
    button.danger:hover { background: #fef2f2; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
    .toolbar select { width: auto; }

    .task { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .task h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .task p { margin: 0 0 8px; color: var(--muted); white-space: pre-wrap; }
    .task small { color: var(--muted); }
    .task .actions { display: flex; flex-direction: column; gap: 6px; min-width: 130px; }
    .task .actions select { padding: 6px 8px; }
    .task.completed h3 { text-decoration: line-through; color: var(--muted); }

    .pill { display: inline-block; font-size: .75rem; padding: 2px 9px; border-radius: 999px; margin-bottom: 6px; }
    .pill.pending { background: #fef3c7; color: #92400e; }
    .pill.in_progress { background: #dbeafe; color: #1e40af; }
    .pill.completed { background: #dcfce7; color: #166534; }

    #message { margin-top: 16px; padding: 10px 14px; border-radius: 8px; display: none; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; }
    #message.success { display: block; background: #dcfce7; color: #166534; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; }

    dialog { border: none; border-radius: 12px; padding: 20px; width: min(92vw, 460px); }
    dialog::backdrop { background: rgba(0, 0, 0, .4); }
    .dialog-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <span id="health" class="badge-status">checking...</span>
    </header>

    <div id="message"></div>

    <!-- Add task -->
    <div class="card">
      <form id="create-form">
        <label for="title">Title</label>
        <input id="title" maxlength="255" placeholder="e.g. Configure Route 53 failover" required>

        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Details..."></textarea>

        <div class="row">
          <div>
            <label for="status">Status</label>
            <select id="status">
              <option value="pending">Pending</option>
              <option value="in_progress">In progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div style="display:flex; align-items:flex-end;">
            <button class="primary" type="submit" style="width:100%;">Add task</button>
          </div>
        </div>
      </form>
    </div>

    <!-- List -->
    <div class="toolbar">
      <strong id="count">Tasks</strong>
      <select id="filter">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- Edit dialog -->
  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <h2 style="margin-top:0;">Edit task</h2>
      <input type="hidden" id="edit-id">

      <label for="edit-title">Title</label>
      <input id="edit-title" maxlength="255" required>

      <label for="edit-description">Description</label>
      <textarea id="edit-description"></textarea>

      <label for="edit-status">Status</label>
      <select id="edit-status">
        <option value="pending">Pending</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
      </select>

      <div class="dialog-buttons">
        <button type="button" id="edit-cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    // Relative URL: works on localhost, EC2, and behind the ALB.
    const API = "/tasks";

    const $ = (id) => document.getElementById(id);
    const STATUS_LABEL = { pending: "Pending", in_progress: "In progress", completed: "Completed" };

    // ---------- helpers ----------
    function showMessage(text, type) {
      const box = $("message");
      box.textContent = text;
      box.className = type;
      clearTimeout(showMessage.timer);
      showMessage.timer = setTimeout(() => { box.className = ""; }, 4000);
    }

    // Wrapper around fetch that turns API errors into readable messages.
    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (response.status === 204) return null;

      let data = null;
      try { data = await response.json(); } catch (_) { /* no JSON body */ }

      if (!response.ok) {
        let detail = "Request failed (" + response.status + ")";
        if (data && typeof data.detail === "string") {
          detail = data.detail;
        } else if (data && Array.isArray(data.detail)) {
          detail = data.detail.map((d) => d.msg).join("; ");   // 422 validation errors
        }
        throw new Error(detail);
      }
      return data;
    }

    function formatDate(iso) {
      // The API returns naive timestamps; treat them as UTC.
      const date = new Date(iso.endsWith("Z") ? iso : iso + "Z");
      return date.toLocaleString();
    }

    // ---------- health badge ----------
    async function checkHealth() {
      const badge = $("health");
      try {
        const res = await fetch("/health/db");
        if (!res.ok) throw new Error();
        badge.textContent = "API + DB healthy";
        badge.className = "badge-status ok";
      } catch (_) {
        badge.textContent = "Unhealthy";
        badge.className = "badge-status bad";
      }
    }

    // ---------- render ----------
    function renderTasks(tasks) {
      const list = $("task-list");
      list.innerHTML = "";
      $("count").textContent = tasks.length + (tasks.length === 1 ? " task" : " tasks");

      if (tasks.length === 0) {
        list.innerHTML = '<div class="card empty">No tasks yet. Add one above.</div>';
        return;
      }

      tasks.forEach((task) => {
        const card = document.createElement("div");
        card.className = "card task" + (task.status === "completed" ? " completed" : "");

        // Build the content with textContent so user input is never run as HTML.
        const info = document.createElement("div");

        const pill = document.createElement("span");
        pill.className = "pill " + task.status;
        pill.textContent = STATUS_LABEL[task.status];

        const title = document.createElement("h3");
        title.textContent = "#" + task.id + "  " + task.title;

        const desc = document.createElement("p");
        desc.textContent = task.description || "";
        desc.style.display = task.description ? "block" : "none";

        const dates = document.createElement("small");
        dates.textContent = "Created " + formatDate(task.created_at) +
                            " · Updated " + formatDate(task.updated_at);

        info.append(pill, title, desc, dates);

        const actions = document.createElement("div");
        actions.className = "actions";

        const statusSelect = document.createElement("select");
        Object.keys(STATUS_LABEL).forEach((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = STATUS_LABEL[value];
          option.selected = value === task.status;
          statusSelect.appendChild(option);
        });
        statusSelect.addEventListener("change", () =>
          updateTask(task.id, { status: statusSelect.value }, "Status updated"));

        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => openEdit(task));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteTask(task.id));

        actions.append(statusSelect, editBtn, deleteBtn);
        card.append(info, actions);
        list.appendChild(card);
      });
    }

    // ---------- CRUD ----------
    async function loadTasks() {
      try {
        const filter = $("filter").value;
        const url = filter ? API + "?status=" + encodeURIComponent(filter) : API;
        renderTasks(await api(url));
      } catch (err) {
        showMessage("Could not load tasks: " + err.message, "error");
      }
    }

    async function createTask(event) {
      event.preventDefault();
      const body = {
        title: $("title").value,
        description: $("description").value || null,
        status: $("status").value,
      };
      try {
        await api(API, { method: "POST", body: JSON.stringify(body) });
        $("create-form").reset();
        showMessage("Task created", "success");
        loadTasks();
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    async function updateTask(id, body, successText) {
      try {
        await api(API + "/" + id, { method: "PUT", body: JSON.stringify(body) });
        showMessage(successText, "success");
        loadTasks();
      } catch (err) {
        showMessage(err.message, "error");
        loadTasks();
      }
    }

    async function deleteTask(id) {
      if (!confirm("Delete task #" + id + "?")) return;
      try {
        await api(API + "/" + id, { method: "DELETE" });
        showMessage("Task deleted", "success");
        loadTasks();
      } catch (err) {
        showMessage(err.message, "error");
      }
    }

    // ---------- edit dialog ----------
    function openEdit(task) {
      $("edit-id").value = task.id;
      $("edit-title").value = task.title;
      $("edit-description").value = task.description || "";
      $("edit-status").value = task.status;
      $("edit-dialog").showModal();
    }

    $("edit-cancel").addEventListener("click", () => $("edit-dialog").close());

    $("edit-form").addEventListener("submit", () => {
      updateTask(
        $("edit-id").value,
        {
          title: $("edit-title").value,
          description: $("edit-description").value,
          status: $("edit-status").value,
        },
        "Task updated"
      );
    });

    // ---------- start ----------
    $("create-form").addEventListener("submit", createTask);
    $("filter").addEventListener("change", loadTasks);
    checkHealth();
    loadTasks();
    setInterval(checkHealth, 30000);
  </script>
</body>
</html>
