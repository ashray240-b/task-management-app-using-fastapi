services:
  api:
    build: .
    container_name: task-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-network

networks:
  task-network:
    driver: bridge

volumes:
  mysql_data:
